# ============================================
# Grafana 仪表盘自动加载配置
# 启动时自动导入 foxchat.json
# ============================================
apiVersion: 1

providers:
  - name: 'FoxChat'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
