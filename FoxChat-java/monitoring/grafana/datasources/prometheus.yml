# ============================================
# Grafana 数据源自动配置
# 启动时自动连接 Prometheus，无需手动添加
# ============================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090   # Docker 内部网络，用服务名
    isDefault: true
    editable: false
